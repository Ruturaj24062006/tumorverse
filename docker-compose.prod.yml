version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tumorverse-db
    environment:
      POSTGRES_DB: tumorverse
      POSTGRES_USER: tumorverse_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tumorverse_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tumorverse-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tumorverse-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tumorverse-network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tumorverse-api
    environment:
      DEBUG: "false"
      DATABASE_URL: postgresql://tumorverse_user:${DB_PASSWORD:-secure_password_change_me}@postgres:5432/tumorverse
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: INFO
      ALGORITHM: HS256
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./models:/models
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - tumorverse-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tumorverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - tumorverse-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: tumorverse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - tumorverse-network

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: tumorverse-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - tumorverse-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  tumorverse-network:
    driver: bridge

# Usage:
# 1. Copy .env.example to .env
# 2. Update credentials in .env
# 3. Run: docker-compose -f docker-compose.prod.yml up -d
# 4. Access:
#    - API: http://localhost:8000
#    - Prometheus: http://localhost:9090
#    - Grafana: http://localhost:3000
